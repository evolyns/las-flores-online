<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E8711D">
<title>Las Flores online</title>
<meta name="description" content="Los locales de la calle Las Flores, en Wilde: qué hay, qué está abierto y cómo llegar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--o:#E8711D;--o2:#FCE6D3;--ink:#2C2C2A;--mute:#77756F;--line:#E8E4DC;--bg:#F6F4EF;--card:#fff;--ok:#1D9E75;--warn:#EF9F27;--bad:#D85A30;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
a{color:inherit}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit}
.wrap{max-width:560px;margin:0 auto}
/* barra de Las Flores: siempre igual en todas las páginas */
.lfbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px}
.lfbar .lf{width:30px;height:30px;border-radius:9px;background:var(--o);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.lfbar b{font-size:16px}.lfbar span{color:var(--mute);font-size:14px}
.lfbar .back{font-size:22px;padding:0 6px 0 0;line-height:1}
.demo{background:#FFF7E8;color:#8A5A12;font-size:12.5px;text-align:center;padding:6px 12px;border-bottom:1px solid #F3E2BE}
/* navegación de abajo */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11.5px;color:var(--mute)}
nav.tabs a svg{width:23px;height:23px}
nav.tabs a.on{color:var(--o);font-weight:600}
main{padding:14px 16px 24px}
h1{font-size:24px;letter-spacing:-.3px;margin:4px 0 2px}
h2{font-size:17px;margin:22px 0 10px}
.sub{color:var(--mute);font-size:14px}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:99px;padding:3px 9px;white-space:nowrap}
.pill.open{background:#E1F5EE;color:#0F6E56}.pill.closed{background:#F1EFE8;color:#77756F}
.dot{width:7px;height:7px;border-radius:99px;background:currentColor;display:inline-block}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px;text-decoration:none}
.btn.main{background:var(--o);color:#fff}.btn.line{border:1px solid var(--line);background:#fff}
.btn.wa{background:#22C35E;color:#fff}
.btn.block{width:100%}
[hidden]{display:none!important}
.btn.sm{padding:7px 11px;font-size:13.5px;border-radius:10px}
.lfbar .camp{margin-left:auto;position:relative;font-size:20px;text-decoration:none;padding:2px 4px;line-height:1}
.lfbar .camp i{position:absolute;top:-6px;right:-8px;background:#D85A30;color:#fff;font-style:normal;font-size:11px;font-weight:700;border-radius:99px;padding:2px 6px}
.talle.agot{opacity:.55;text-decoration:line-through}.talle.agot.on{opacity:1}
.av{display:flex;gap:12px;padding:12px 14px;align-items:flex-start;text-decoration:none;color:inherit;border-top:1px solid var(--line)}
.av:first-child{border-top:0}.av.nueva{background:#FFF8F1}
.toast{position:fixed;left:16px;right:16px;top:12px;z-index:95;max-width:528px;margin:0 auto;background:#2C2C2A;color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:block;text-decoration:none;animation:bajar .3s ease}
@keyframes bajar{from{transform:translateY(-20px);opacity:0}to{transform:none;opacity:1}}
.muted{color:var(--mute)}
.empty{padding:28px 16px;text-align:center;color:var(--mute);font-size:14.5px}
.loading{padding:40px;text-align:center;color:var(--mute)}
.err{background:#FCEBE6;color:#8E2F14;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.okmsg{background:#E1F5EE;color:#0F5C46;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
/* listas de locales */
.locs{display:flex;flex-direction:column;gap:10px}
.loc{display:flex;gap:12px;align-items:center;padding:12px;text-decoration:none}
.loc .ic{width:52px;height:52px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:700}
.loc .t{flex:1;min-width:0}.loc b{display:block;font-size:16px}.loc small{color:var(--mute);font-size:13px}
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px}
.hscroll>*{scroll-snap-align:start;flex:none}
.promo{width:260px;padding:14px;border-radius:var(--r);color:#fff;text-decoration:none;display:flex;flex-direction:column;gap:6px;min-height:118px}
.promo b{font-size:16px}.promo small{opacity:.9;font-size:13px}.promo .cd{margin-top:auto;font-size:12.5px;font-weight:600;background:rgba(0,0,0,.18);border-radius:99px;padding:3px 9px;align-self:flex-start}
.vivo{display:flex;gap:10px;align-items:center;padding:12px 14px;text-decoration:none}
.sem{width:14px;height:14px;border-radius:99px;flex:none}
/* buscar */
.search{display:flex;gap:8px;margin:6px 0 4px}
.search input{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;outline:none}
.search input:focus{border-color:var(--o)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:13.5px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.res{display:flex;gap:12px;align-items:center;padding:11px 12px;text-decoration:none}
.res .ic{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.res .t{flex:1;min-width:0}.res b{display:block;font-size:15px}.res small{color:var(--mute);font-size:13px}
.price{font-weight:700;white-space:nowrap}
/* mapa */
.mapa svg{width:100%;height:auto;display:block}
/* perfil */
.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.field label{font-size:13.5px;font-weight:600}
.field input{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;outline:none;font-size:17px}
.field input:focus{border-color:var(--o)}
.tarjeta{border-radius:18px;padding:18px;color:#fff;background:linear-gradient(135deg,#E8711D,#C2560C)}
.tarjeta .qr{background:#fff;border-radius:12px;padding:10px;width:180px;height:180px;margin:12px auto 6px;display:flex;align-items:center;justify-content:center}
.tarjeta .qr svg,.tarjeta .qr img{width:160px;height:160px}
.act{display:flex;gap:12px;align-items:center;padding:12px 14px}
.act .ic{width:38px;height:38px;border-radius:10px;background:var(--o2);color:var(--o);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
/* ===== página del local: el tema sale de su vidriera publicada ===== */
.tienda{--a:#E8711D;--fondo:#fff;--tinta:#2C2C2A;--suave:#F4EEE8;--rad:14px;--fn:inherit;background:var(--fondo);color:var(--tinta);min-height:100vh}
.tienda .tex{position:absolute;inset:0;pointer-events:none;opacity:.55}
.tienda .cab{position:relative;padding:26px 16px 18px;overflow:hidden}
.tienda .nom{font-family:var(--fn);font-size:40px;line-height:1.05;color:var(--a);overflow-wrap:anywhere}
.tienda .meta{font-size:13.5px;opacity:.8;margin-top:6px}
.tienda .cab.centro{text-align:center}
.tienda .cab.cartel{background:var(--tinta);color:var(--fondo)}
.tienda .cab.cartel .nom{color:var(--fondo);text-transform:uppercase;letter-spacing:1px;font-size:34px}
.tienda .cab.portada .band{height:120px;margin:-26px -16px 16px;background:var(--suave);display:flex;align-items:center;justify-content:center;font-size:56px;gap:22px}
.tienda .cab.escudo .esc{width:76px;height:76px;border-radius:50%;border:3px solid var(--a);color:var(--a);display:flex;align-items:center;justify-content:center;font-family:var(--fn);font-size:36px;margin-bottom:12px}
.tienda .cab.escudo.centro .esc{margin-left:auto;margin-right:auto}
.tienda .cab.firma .nom::after{content:"";display:block;width:90px;height:3px;background:var(--a);border-radius:3px;margin-top:10px}
.tienda .cab.firma.centro .nom::after{margin-left:auto;margin-right:auto}
.tienda .estado{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tienda .cab.centro .estado{justify-content:center}
.tienda section{padding:8px 16px 14px;position:relative}
.tienda h3{font-family:var(--fn);font-size:21px;margin:10px 0 10px;color:var(--tinta)}
.tienda .box{background:var(--suave);border-radius:var(--rad);padding:14px}
.tienda .promoL{background:var(--a);color:#fff;border-radius:var(--rad);padding:16px}
.tienda .promoL b{font-family:var(--fn);font-size:20px;display:block}.tienda .promoL small{opacity:.92}
.tienda .prods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tienda .prods.lista{grid-template-columns:1fr}
.tienda .prods.mosaico{grid-template-columns:1fr 1fr 1fr;gap:6px}
.tienda .prods.lookbook{grid-template-columns:1fr}
.tienda .prod{background:#fff;border-radius:var(--rad);overflow:hidden;border:1px solid rgba(0,0,0,.06);color:#2C2C2A;text-align:left;width:100%}
.tienda .prod .img{aspect-ratio:1;background:var(--suave);display:flex;align-items:center;justify-content:center;font-size:42px;overflow:hidden}
.tienda .prod .img img,.sheet .big img{width:100%;height:100%;object-fit:cover}
.tienda .prods.lookbook .prod .img{aspect-ratio:4/3;font-size:70px}
.tienda .prods.lista .prod{display:flex;align-items:center}
.tienda .prods.lista .prod .img{width:72px;flex:none;font-size:30px}
.tienda .prods.mosaico .prod .info{display:none}
.tienda .prod .info{padding:9px 11px}
.tienda .prod b{display:block;font-size:14.5px}.tienda .prod span{font-size:14px;font-weight:700}
.tienda .hs{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px}
.tienda .hs .prod{width:150px;flex:none}
.tienda .serv{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid rgba(0,0,0,.07)}
.tienda .serv:first-child{border-top:0}
.tienda .serv .t{flex:1}
.tienda .op{padding:12px 0;border-top:1px solid rgba(0,0,0,.07)}
.tienda .estrellas{color:#E2A400;letter-spacing:1px}
.tienda .fijo{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));padding:10px 16px;background:linear-gradient(to top,var(--fondo) 70%,transparent);display:flex;gap:8px;z-index:5}
.tienda .fijo .btn{flex:1}
.tienda .calle{height:46px;position:relative;border-radius:10px;background:#E9E6DF;margin:6px 0 10px;overflow:hidden}
.tienda .calle .pin{position:absolute;top:8px;width:30px;height:30px;margin-left:-15px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--a)}
/* hoja de producto */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:#fff;color:#2C2C2A;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet .big{aspect-ratio:16/10;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:80px;margin-bottom:12px}
.talles{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.talle{border:1px solid var(--line);border-radius:10px;padding:8px 13px;font-weight:600;background:#fff}
.talle.on{border-color:var(--ink);background:var(--ink);color:#fff}
.talle:disabled{opacity:.35;text-decoration:line-through}
/* intro */
.intro{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px}
.intro .n{font-size:46px;opacity:0;transform:scale(.92);animation:aparecer .9s ease forwards .2s;text-align:center;padding:0 20px}
.intro .saltar{position:absolute;right:16px;bottom:calc(24px + env(safe-area-inset-bottom));background:rgba(255,255,255,.18);color:inherit;border-radius:99px;padding:9px 16px;font-size:14px;font-weight:600}
.intro.persiana::before{content:"";position:absolute;inset:0;background:inherit;transform-origin:top;animation:persiana 1.4s ease forwards .6s;z-index:-1}
@keyframes aparecer{to{opacity:1;transform:none}}
@keyframes persiana{to{transform:scaleY(0)}}
@media (prefers-reduced-motion:reduce){.intro .n{animation:none;opacity:1;transform:none}}
</style>
</head>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';

// ---------- Conexión (clave pública: es segura en el navegador porque la base tiene RLS) ----------
const SUPABASE_URL = 'https://jvqunkkiypbvypgumxql.supabase.co';
const SUPABASE_KEY = 'sb_publishable_r1mug-RwM_3RCSoUQ6lo0Q_KiHiSHlZ';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const MODO_PRUEBA = true;   // muestra el aviso de "locales de ejemplo"
// Vista previa del editor de vidriera: recibe el borrador por mensaje y lo dibuja sin publicarlo
const EN_PREVIA = window.top !== window;
const PREVIEW = {};
let forzarIntro = false;
window.addEventListener('message', ev => {
  if (ev.origin !== location.origin) return;
  if (ev.data?.tipo === 'lf-preview') PREVIEW[ev.data.comercio_id] = ev.data.contenido;
  else if (ev.data?.tipo === 'lf-intro') forzarIntro = true;
  else return;
  const m = location.hash.match(/^#\/l\/(.+)$/);
  if (D.listo && m) pLocal(decodeURIComponent(m[1]));
});

// ---------- Utilidades ----------
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pesos = n => '$' + Number(n).toLocaleString('es-AR', {maximumFractionDigits: 0});
const TZ = 'America/Argentina/Buenos_Aires';
const EMOJI = {'Moda':'👗','Calzado':'👟','Gastronomía':'☕','Almacén y alimentos':'🧺','Tecnología':'📱','Salud y óptica':'👓',
  'Belleza y estética':'✂️','Deporte y bienestar':'🏋️','Regalos y librería':'🎁','Hogar y deco':'🪴','Mascotas':'🐾','Servicios':'🔧','Cultura y eventos':'🎭'};
const FUENTES = {
  elegante: ["'Playfair Display'", 'Playfair+Display:ital,wght@1,600', 'italic'],
  tradicion:["'Lora'", 'Lora:wght@600'],
  moderna:  ["'Montserrat'", 'Montserrat:wght@700', 'upper'],
  urbana:   ["'Oswald'", 'Oswald:wght@600', 'upper'],
  editorial:["'Fraunces'", 'Fraunces:wght@600'],
  redonda:  ["'Poppins'", 'Poppins:wght@600'],
  libro:    ["'Libre Baskerville'", 'Libre+Baskerville:wght@700'],
  romana:   ["'Cinzel'", 'Cinzel:wght@600', 'upper'],
  escolar:  ["'Andika'", 'Andika:wght@700'],
  maquina:  ["'Courier Prime'", 'Courier+Prime:wght@700']
};
const cargadas = new Set();
function usarFuente(k) {
  const f = FUENTES[k] || FUENTES.tradicion;
  if (!cargadas.has(k)) {
    cargadas.add(k);
    const l = document.createElement('link'); l.rel = 'stylesheet';
    l.href = `https://fonts.googleapis.com/css2?family=${f[1]}&display=swap`; document.head.appendChild(l);
  }
  return f;
}
function ahoraBA() {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', {timeZone: TZ, weekday: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'})
    .formatToParts(new Date()).map(x => [x.type, x.value]));
  return {dia: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday), hora: `${p.hour}:${p.minute}`};
}
function abierto(cid) {
  const {dia, hora} = ahoraBA();
  return D.horarios.some(h => h.comercio_id === cid && h.dia_semana === dia && hora >= h.abre.slice(0,5) && hora < h.cierra.slice(0,5));
}
function proximaApertura(cid) {
  const {dia, hora} = ahoraBA();
  for (let i = 0; i < 7; i++) {
    const d = (dia + i) % 7;
    const hs = D.horarios.filter(h => h.comercio_id === cid && h.dia_semana === d && (i > 0 || h.abre.slice(0,5) > hora))
      .sort((a, b) => a.abre.localeCompare(b.abre));
    if (hs.length) return (i === 0 ? 'hoy' : i === 1 ? 'mañana' : ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][d]) + ' a las ' + hs[0].abre.slice(0,5);
  }
  return '';
}
function horarioHoy(cid) {
  const {dia} = ahoraBA();
  const hs = D.horarios.filter(h => h.comercio_id === cid && h.dia_semana === dia).sort((a,b) => a.abre.localeCompare(b.abre));
  return hs.length ? hs.map(h => h.abre.slice(0,5) + ' a ' + h.cierra.slice(0,5)).join(' y ') : 'hoy cerrado';
}
function estadoPill(cid) {
  return abierto(cid) ? `<span class="pill open"><span class="dot"></span>Abierto ahora</span>`
                      : `<span class="pill closed"><span class="dot"></span>Cerrado · abre ${esc(proximaApertura(cid))}</span>`;
}
function falta(hasta) {
  const ms = new Date(hasta) - Date.now(); if (ms <= 0) return 'terminó';
  const h = Math.floor(ms / 36e5), d = Math.floor(h / 24);
  return d >= 1 ? `termina en ${d} d ${h % 24} h` : h >= 1 ? `termina en ${h} h ${Math.floor(ms / 6e4) % 60} min` : `termina en ${Math.floor(ms / 6e4)} min`;
}
const comoLlegar = c => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`Las Flores ${c.altura}, Wilde, Buenos Aires`)}`;
const estiloDe = c => (D.vidrieras[c.id]?.contenido?.estilo) || {color: '#E8711D'};
const errorTexto = e => (e?.message || String(e)).replace(/^.*?: /, '');
async function registrar(cid, evento, producto_id = null) {
  if (evento === 'vista') {   // una visita cada 30 minutos por local o producto: recargar no infla los números
    const k = `v-${cid}-${producto_id || ''}`;
    try { const t = +sessionStorage.getItem(k); if (t && Date.now() - t < 30 * 60000) return; sessionStorage.setItem(k, Date.now()); } catch (_) {}
  }
  try { await sb.from('visitas').insert({comercio_id: cid, evento, producto_id}); } catch (_) {}
}

// ---------- Datos que comparten todas las pantallas ----------
const D = {listo: false};
async function cargarTodo() {
  const [com, vid, hor, pro, viv, cal] = await Promise.all([
    sb.from('comercios').select('id,nombre,slug,altura,mano,whatsapp,instagram,estado,rubros(nombre,modulo),categorias_comercio(nombre)').order('altura'),
    sb.from('vidriera_publicada').select('comercio_id,slug,contenido'),
    sb.from('horarios').select('*'),
    sb.from('promos').select('*').gt('hasta', new Date().toISOString()).order('hasta'),
    sb.from('en_vivo_vigente').select('*'),
    sb.from('calificacion_comercios').select('*')
  ]);
  const err = [com, vid, hor, pro, viv, cal].find(r => r.error);
  if (err) throw err.error;
  // El dueño y el moderador ven también los locales pendientes, pero solo en la vista previa del editor
  D.comercios = com.data.filter(c => c.estado === 'activo' || EN_PREVIA); D.horarios = hor.data; D.promos = pro.data; D.vivo = viv.data;
  D.vidrieras = Object.fromEntries(vid.data.map(v => [v.comercio_id, v]));
  D.calif = Object.fromEntries(cal.data.map(c => [c.comercio_id, c]));
  D.porId = Object.fromEntries(D.comercios.map(c => [c.id, c]));
  D.listo = true;
}

// ---------- Avisos dentro de la app (gratis) y tiempo real ----------
let NOAV = 0, canalAvisos = null;
const ICONO_AV = {talle: '👟', precio: '🏷️', aviso: '📣', opinion: '⭐', respuesta: '💬', apartado: '🛍️', turno: '📅', puntos: '🎁', local: '🏪'};
function pintarCampana() { document.querySelectorAll('.camp').forEach(a => a.innerHTML = '🔔' + (NOAV ? `<i>${NOAV > 99 ? '99+' : NOAV}</i>` : '')); }
function hace(d) {
  const m = Math.round((Date.now() - new Date(d)) / 60000);
  if (m < 1) return 'recién'; if (m < 60) return `hace ${m} min`; if (m < 24 * 60) return `hace ${Math.round(m / 60)} h`;
  return new Date(d).toLocaleDateString('es-AR', {day: 'numeric', month: 'short'});
}
function toast(n) {
  const a = document.createElement('a'); a.className = 'toast'; a.href = n.link || '#/avisos';
  a.innerHTML = `<b>${ICONO_AV[n.tipo] || '🔔'} ${esc(n.titulo)}</b>${n.texto ? `<br><span style="opacity:.85">${esc(n.texto)}</span>` : ''}`;
  a.onclick = () => a.remove(); document.body.appendChild(a); setTimeout(() => a.remove(), 6000);
  try { navigator.vibrate?.(120); } catch (_) {}
}
async function conectarAvisos() {
  if (!SESION || EN_PREVIA) return;
  const {count} = await sb.from('notificaciones').select('id', {count: 'exact', head: true}).is('leida_en', null);
  NOAV = count || 0; pintarCampana();
  if (canalAvisos) return;
  canalAvisos = sb.channel('lf-avisos-' + SESION.user.id)
    .on('postgres_changes', {event: 'INSERT', schema: 'public', table: 'notificaciones', filter: 'perfil_id=eq.' + SESION.user.id}, ({new: n}) => {
      if (location.hash === '#/avisos') return pAvisos();
      NOAV++; pintarCampana(); toast(n);
      if (n.tipo === 'puntos' && location.hash === '#/perfil') pPerfil();
    }).subscribe();
}
// Semáforo de mesas y demás estados en vivo: se actualizan solos, con o sin cuenta
if (!EN_PREVIA) sb.channel('lf-vivo').on('postgres_changes', {event: '*', schema: 'public', table: 'estados_en_vivo'}, async () => {

  else { const m = h.match(/^#\/l\/(.+)$/); if (m) { const y = window.scrollY; await pLocal(decodeURIComponent(m[1]), true); window.scrollTo(0, y); } }
}).subscribe();

let filtroRubro = '';
function pBuscar(q = '') {
  marcarTab('buscar');
  const rubros = [...new Set(D.comercios.map(c => c.rubros?.nombre))];
  $app.innerHTML = barra() + `<main class="wrap">

    <div class="chips">${['', ...rubros].map(r => `<button class="chip ${r === filtroRubro ? 'on' : ''}" data-r="${esc(r)}">${r ? (EMOJI[r] || '') + ' ' + esc(r) : 'Todo'}</button>`).join('')}</div>
    <div id="res">${q ? '<div class="loading">Buscando…</div>' : '<div class="empty">Escribí qué estás buscando. Te mostramos en qué local está, si está abierto y cómo llegar.</div>'}</div>

  if (q) buscar(q);

async function buscar(q) {
  // Busca sin tildes y en singular o plural: "zapatillas" encuentra "Zapatilla urbana"
  const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const raiz = w => w.length > 4 ? w.replace(/(es|s)$/, '') : w;
  const palabras = norm(q).split(/\s+/).filter(Boolean);
  const numero = palabras.find(p => /^\d{2}$/.test(p));                 // "41" → talle
  const raices = palabras.filter(p => p !== numero).map(raiz);
  const enRubro = c => !filtroRubro || c.rubros?.nombre === filtroRubro;
  if (!D.productos) {
    const [p, s] = await Promise.all([
      sb.from('productos').select('id,nombre,precio,comercio_id,variantes(talle,stock)').limit(2000),
      sb.from('servicios').select('id,nombre,precio,duracion_min,comercio_id').limit(1000)]);
    D.productos = p.data || []; D.servicios = s.data || [];
  }
  const delLocal = c => [c.nombre, c.rubros?.nombre, c.categorias_comercio?.nombre].join(' ');
  const coincide = t => raices.every(r => norm(t).includes(r));
  const visibles = D.productos.filter(p => D.porId[p.comercio_id] && enRubro(D.porId[p.comercio_id]));
  const porNombre = visibles.filter(p => raices.length && coincide(p.nombre));
  let prods = !raices.length ? (numero ? visibles : []) : porNombre.length ? porNombre : visibles.filter(p => coincide(p.nombre + ' ' + delLocal(D.porId[p.comercio_id])));
  if (numero) prods = prods.filter(p => p.variantes?.some(v => v.talle === numero && v.stock > 0));
  const servs = numero || !raices.length ? [] : D.servicios.filter(s => D.porId[s.comercio_id] && enRubro(D.porId[s.comercio_id]) && coincide(s.nombre + ' ' + delLocal(D.porId[s.comercio_id])));
  const locs = !raices.length ? [] : D.comercios.filter(c => enRubro(c) && coincide(delLocal(c)) && !prods.some(p => p.comercio_id === c.id) && !servs.some(s => s.comercio_id === c.id));
  const total = prods.length + servs.length + locs.length;
  sb.from('busquedas').insert({texto: q, resultados: total, filtros: filtroRubro ? {rubro: filtroRubro} : {}, perfil_id: SESION?.user?.id ?? null}).then(() => {});
  const fila = (c, titulo, detalle, precio) => `<a class="card res" href="#/l/${esc(c.slug)}"><span class="ic" style="background:${esc(estiloDe(c).color)}22">${EMOJI[c.rubros?.nombre] || '🏪'}</span>
      <span class="t"><b>${esc(titulo)}</b><small>${esc(c.nombre)} · Las Flores ${c.altura} · ${abierto(c.id) ? 'abierto' : 'cerrado'}${detalle ? ' · ' + esc(detalle) : ''}</small></span>${precio != null ? `<span class="price">${pesos(precio)}</span>` : ''}</a>`;
  document.getElementById('res').innerHTML = total ? `<p class="sub" style="margin:8px 0">${total} resultado${total > 1 ? 's' : ''}</p><div class="locs">
      ${locs.map(tarjetaLocal).join('')}
      ${prods.map(p => fila(D.porId[p.comercio_id], p.nombre, numero ? `hay ${numero}` : '', p.precio)).join('')}
      ${servs.map(s => fila(D.porId[s.comercio_id], s.nombre, `${s.duracion_min} min`, s.precio || null)).join('')}</div>`
    : `<div class="empty">No encontramos “${esc(q)}” en Las Flores.<br>Lo anotamos: así sabemos qué falta en la calle.</div>`;
}

// ---------- 5. Perfil: entrar con el celular, tarjeta de puntos ----------
let telPendiente = '';
const normalizarTel = t => { const d = t.replace(/\D/g, ''); return d.startsWith('54') ? d : d.startsWith('0') ? '549' + d.slice(1).replace(/^(\d{2,4})15/, '$1') : '549' + d; };
async function pPerfil(msg = '') {
  marcarTab('perfil');
  if (!SESION) {
    $app.innerHTML = barra() + `<main class="wrap"><h1>Tu cuenta</h1>
      <p class="sub">Mirar, buscar y consultar no necesita cuenta. Con tu celular sumás puntos en los locales, apartás y seguís a los que te gustan.</p>
      ${!telPendiente ? `<form id="f1"><div class="field"><label for="tel">Tu celular</label><input id="tel" type="tel" inputmode="numeric" placeholder="11 2345 6789" autocomplete="tel"></div>
        <button class="btn main block">Mandarme el código</button></form>`
      : `<form id="f2"><p style="margin-top:14px">Te mandamos un código al <b>+${esc(telPendiente)}</b>.</p>
        <div class="field"><label for="cod">Código de 6 números</label><input id="cod" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••"></div>
        <button class="btn main block">Entrar</button><p style="margin-top:12px"><a href="#" id="otro">Usar otro número</a></p></form>`}
      ${msg}
      ${MODO_PRUEBA ? '<div class="card" style="padding:12px 14px;margin-top:18px;font-size:13.5px;line-height:1.5"><b>Modo prueba:</b> no se mandan mensajes reales. Podés usar 11 0000 0001 con el código 111111.</div>' : ''}
    </main>`;
    const f1 = document.getElementById('f1'), f2 = document.getElementById('f2');
    if (f1) f1.onsubmit = async ev => { ev.preventDefault();
      const tel = normalizarTel(document.getElementById('tel').value);
      if (tel.length < 12) return pPerfil('<div class="err">Revisá el número: código de área y número, sin el 15.</div>');
      f1.querySelector('button').disabled = true;
      const {error} = await sb.auth.signInWithOtp({phone: '+' + tel});
      if (error) return pPerfil(`<div class="err">${esc(error.message)}</div>`);
      telPendiente = tel; pPerfil();
    };
    if (f2) { document.getElementById('otro').onclick = e => { e.preventDefault(); telPendiente = ''; pPerfil(); };
      f2.onsubmit = async ev => { ev.preventDefault();
        f2.querySelector('button').disabled = true;
        const {data, error} = await sb.auth.verifyOtp({phone: '+' + telPendiente, token: document.getElementById('cod').value.trim(), type: 'sms'});
        if (error) return pPerfil('<div class="err">El código no es correcto o ya venció. Probá de nuevo.</div>');
        SESION = data.session; telPendiente = ''; pPerfil();
      }; }
    return;
  }
  const uid = SESION.user.id;
  const [{data: perfil}, {data: saldo}, {data: sigo}, {data: equipo}] = await Promise.all([
    sb.from('perfiles').select('nombre,telefono,creado,es_moderador').eq('id', uid).maybeSingle(),
    sb.from('saldo_puntos').select('saldo').eq('perfil_id', uid).maybeSingle(),
    sb.from('seguimientos').select('comercio_id').eq('perfil_id', uid),

function sessionStorageGet(k) { try { return sessionStorage.getItem(k); } catch (_) { return null; } }
function mezclar(a, b, t) {
  const h = x => [1, 3, 5].map(i => parseInt(x.slice(i, i + 2), 16));
  const [r1, g1, b1] = h(a || '#E8711D'), [r2, g2, b2] = h(b);
  return '#' + [r1 + (r2 - r1) * t, g1 + (g2 - g1) * t, b1 + (b2 - b1) * t].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
}
function textura(t, col, nombre) {
  const c = mezclar(col || '#E8711D', '#ffffff', .75);
  const fondos = {
    papel: `radial-gradient(${c} 0.7px, transparent 0.8px) 0 0/7px 7px, radial-gradient(${c} 0.6px, transparent 0.7px) 3px 4px/11px 11px`,
    rayas: `repeating-linear-gradient(135deg, ${c} 0 2px, transparent 2px 14px)`,
    puntos: `radial-gradient(${c} 2px, transparent 2.5px) 0 0/18px 18px`
  };
  if (t === 'logo') return `<div class="tex" style="display:flex;align-items:center;justify-content:flex-end;font-size:160px;color:${c};font-weight:700;padding-right:8px">${esc(nombre[0])}</div>`;
  return fondos[t] ? `<div class="tex" style="background:${fondos[t]}"></div>` : '';
}
function mostrarIntro(c, intro, e, fam, modo, fondo, tinta) {
  try { sessionStorage.setItem('intro-' + c.id, '1'); } catch (_) {}
  const dur = Math.min(3000, intro.duracion_ms || 2500);
  const d = document.createElement('div');
  d.className = 'intro ' + (intro.tipo === 'persiana' || intro.tipo === 'telon' ? 'persiana' : '');
  d.style.background = e.color; d.style.color = '#fff';
  const txt = intro.tipo === 'frase' && intro.texto ? intro.texto : c.nombre;
  d.innerHTML = `<div class="n" style="font-family:${fam},serif;${modo === 'italic' ? 'font-style:italic;' : ''}">${esc(modo === 'upper' ? txt.toUpperCase() : txt)}</div><button class="saltar">Saltar ›</button>`;
  document.body.appendChild(d);
  const fin = () => { d.style.transition = 'opacity .35s'; d.style.opacity = 0; setTimeout(() => d.remove(), 360); registrar(c.id, 'intro_salteada'); };
  d.querySelector('.saltar').onclick = fin; d.onclick = fin;
  setTimeout(() => { if (d.isConnected) { d.style.transition = 'opacity .35s'; d.style.opacity = 0; setTimeout(() => d.remove(), 360); } }, dur);
}
function alertaSuave(t) { const d = document.createElement('div'); d.className = 'err'; d.style.cssText = 'position:fixed;left:16px;right:16px;bottom:90px;z-index:90;max-width:528px;margin:0 auto'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 4000); }

async function abrirWhatsApp(c, producto = null, texto = '') {

      ${c.rubros?.modulo !== 'menu' ? '<button class="btn block muted" id="pprecio" style="font-weight:500;font-size:14px">🏷️ Avisame si baja de precio</button>' : ''}
      <div id="pmsg"></div><button class="btn block muted" id="pcerrar">Cerrar</button></div></div>`;
  document.body.appendChild(sh);

  const sinStock = id => (p.variantes || []).find(v => v.id === id)?.stock <= 0;
  const actualizar = () => {
    const ag = elegido && sinStock(elegido), bA = sh.querySelector('#papartar'), bV = sh.querySelector('#pavisar');
    if (bA) bA.hidden = !!ag;
    bV.hidden = !ag; if (ag) bV.textContent = `🔔 Avisame cuando vuelva${vs.length ? ' el talle ' + (vs.find(v => v.id === elegido)?.talle || '') : ''}`;
  };
  sh.querySelectorAll('.talle').forEach(b => b.onclick = () => { sh.querySelectorAll('.talle').forEach(x => x.classList.remove('on')); b.classList.add('on'); elegido = +b.dataset.v; sh.querySelector('#pmsg').innerHTML = ''; actualizar(); });
  actualizar();
  const pedirAviso = async (fila, ok) => {
    const m = sh.querySelector('#pmsg');

  sh.onclick = ev => { if (ev.target === sh) sh.remove(); };

    m.innerHTML = error ? `<div class="err">${esc(errorTexto(error))}</div>`
      : `<div class="okmsg">¡Listo! Te lo guardan hasta ${new Date(data.vence).toLocaleString('es-AR', {weekday:'long', hour:'2-digit', minute:'2-digit'})}. Mostrá el código <b>${esc(data.codigo)}</b> en el local.</div>`;
    ba.disabled = false;
  };
}

// ---------- Rutas ----------
async function ruta() {
  window.scrollTo(0, 0);
  if (!D.listo) {
    try { await cargarTodo(); }
    catch (e) { $app.innerHTML = barra() + `<main class="wrap"><div class="err">No pudimos cargar Las Flores: ${esc(e.message || e)}</div></main>`; return; }
  }
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  const [a, b] = h.split('/');
  if (a === 'l' && b) return pLocal(b);
  if (a === 'buscar') return pBuscar(b || '');
  if (a === 'mapa') return pMapa();
  if (a === 'actividad') return pActividad();
  if (a === 'perfil') return pPerfil();
  if (a === 'avisos') return pAvisos();
  return pInicio();
}
window.addEventListener('hashchange', ruta);
