<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2C2C2A">
<title>Moderación · Las Flores online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--o:#E8711D;--o2:#FCE6D3;--ink:#2C2C2A;--mute:#77756F;--line:#E8E4DC;--bg:#F6F4EF;--ok:#1D9E75;--bad:#D85A30}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit}
a{color:inherit}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:10px}
.top .lf{width:30px;height:30px;border-radius:9px;background:var(--o);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.top b{font-size:16px;flex:1}
.top a{font-size:13px;opacity:.85;text-decoration:none}
.demo{background:#FFF7E8;color:#8A5A12;font-size:12.5px;text-align:center;padding:6px 12px}
.lay{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 50px)}
.side{border-right:1px solid var(--line);background:#fff;padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;text-decoration:none;font-weight:500;color:#4A4945}
.side a.on{background:var(--o2);color:#8A3E08;font-weight:600}
.side a i{font-style:normal;width:20px;text-align:center}
.side a em{margin-left:auto;font-style:normal;background:var(--bad);color:#fff;font-size:11.5px;font-weight:700;border-radius:99px;padding:1px 7px}
main{padding:22px 26px 40px;max-width:1100px;width:100%;min-width:0}
h1{font-size:23px;letter-spacing:-.3px;margin:0 0 4px}
h2{font-size:16px;margin:24px 0 10px}
h3{font-size:15px;margin:0 0 10px}
.sub{color:var(--mute);font-size:14px}
.card{background:#fff;border-radius:14px;border:1px solid var(--line)}
.pad{padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px;margin-top:16px}
.tile{padding:14px 16px;text-decoration:none;display:block}
.tile b{font-size:28px;display:block;letter-spacing:-.5px}.tile span{font-size:13.5px;color:var(--mute)}
.tile.alerta{border-color:#F2C2B2;background:#FFF8F5}.tile.alerta b{color:var(--bad)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.btn.main{background:var(--o);color:#fff}.btn.dark{background:var(--ink);color:#fff}.btn.line{border:1px solid var(--line);background:#fff}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:#fff;border:1px solid #F2C2B2;color:#8E2F14}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.field{display:flex;flex-direction:column;gap:5px;margin:8px 0}
.field label{font-size:13px;font-weight:600}
.field small{color:var(--mute);font-size:12.5px}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;outline:none;font-size:15px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--o)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.f3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:0 12px}
.err{background:#FCEBE6;color:#8E2F14;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.okmsg{background:#E1F5EE;color:#0F5C46;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.hint{font-size:13px;margin-top:4px}.hint.b{color:var(--ok)}.hint.m{color:var(--bad)}
.empty{padding:22px 16px;text-align:center;color:var(--mute);font-size:14px}
.loading{padding:40px;text-align:center;color:var(--mute)}
.pill{display:inline-flex;font-size:12px;font-weight:600;border-radius:99px;padding:3px 9px;white-space:nowrap}
.pill.g{background:#E1F5EE;color:#0F6E56}.pill.y{background:#FFF4D6;color:#7A5A00}.pill.r{background:#FCEBE6;color:#8E2F14}.pill.n{background:#F1EFE8;color:#77756F}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mute);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:#FBFAF7}
.tw{overflow-x:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{padding:8px 12px;font-size:13.5px;font-weight:500;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--ink);color:#fff}
.buscar{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;min-width:220px;flex:1;max-width:340px}
.pasos{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:16px 0 6px}
.paso{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px}
.paso b{display:block;font-size:13.5px;margin-bottom:2px}
.paso.hecho{border-color:#9FD9C5;background:#F2FBF7}.paso.hecho b::before{content:'✓ ';color:var(--ok)}
.paso.ahora{border-color:var(--o);box-shadow:0 0 0 2px var(--o2)}
.ficha>div,.cols>div{min-width:0}
.ficha{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;align-items:start}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0}.item small{color:var(--mute);font-size:12.5px;display:block}
.op{padding:14px 16px;border-top:1px solid var(--line)}
.op:first-child{border-top:0}
.op p{margin:6px 0 10px;line-height:1.45}
.est{color:#E8A317;letter-spacing:1px}
.hor{display:grid;grid-template-columns:92px 1fr 1fr 1fr 1fr;gap:6px;align-items:center;font-size:13.5px;margin-top:4px}
.hor input{border:1px solid var(--line);border-radius:8px;padding:6px 6px;font-size:13.5px;width:100%}
.barra{height:10px;border-radius:99px;background:#F1EFE8;overflow:hidden;margin:8px 0 4px}
.barra i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.barra i.y{background:#EF9F27}.barra i.r{background:var(--bad)}
.aud td small{color:var(--mute)}
.aud td:first-child{white-space:nowrap}
.aud .det{font-size:13px;color:#4A4945;max-width:420px;word-break:break-word}
code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:#F1EFE8;border-radius:5px;padding:1px 5px}
@media (max-width:860px){
  .lay{grid-template-columns:1fr}
  .side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  .side a{flex:none;padding:8px 10px}
  main{padding:16px}
  .cols,.ficha,.f2,.f3{grid-template-columns:minmax(0,1fr)}
  .hor{grid-template-columns:70px repeat(4,minmax(0,1fr));gap:4px}
  .hor input{font-size:12px;padding:5px 2px}
  .hor b{font-size:12.5px}
  .pasos{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div id="app"><div class="loading">Cargando…</div></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
const SUPABASE_URL = 'https://jvqunkkiypbvypgumxql.supabase.co';
const SUPABASE_KEY = 'sb_publishable_r1mug-RwM_3RCSoUQ6lo0Q_KiHiSHlZ';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
// Si la sesión guardada venció y no se puede renovar, se cierra sola (si no, la base contesta "JWT expired")
async function sesionValida() {
  const {data: {session}} = await sb.auth.getSession();
  if (!session) return null;
  if (session.expires_at && session.expires_at * 1000 < Date.now() + 30000) {
    const {data, error} = await sb.auth.refreshSession();
    if (error || !data?.session) { await sb.auth.signOut({scope: 'local'}); return null; }
    return data.session;
  }
  return session;
}
const MODO_PRUEBA = true;

const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pesos = n => '$' + Number(n || 0).toLocaleString('es-AR', {maximumFractionDigits: 0});
const errorTexto = e => (e?.message || String(e)).replace(/^ERROR:\s*/, '');
const fecha = d => d ? new Date(d.length === 10 ? d + 'T12:00' : d).toLocaleDateString('es-AR', {day: 'numeric', month: 'short', year: 'numeric'}) : '—';
const fechaHora = d => new Date(d).toLocaleString('es-AR', {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'});
const tel = t => !t ? '—' : /^54911\d{8}$/.test(t) ? `11 ${t.slice(5, 9)}-${t.slice(9)}` : /^549\d{10}$/.test(t) ? `+54 9 ${t.slice(3)}` : '+' + t;
const DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const ESTADO = {activo: ['g', 'Activo'], pendiente: ['y', 'Pendiente'], suspendido: ['r', 'Pausado']};
const pillEstado = e => `<span class="pill ${ESTADO[e]?.[0] || 'n'}">${ESTADO[e]?.[1] || esc(e)}</span>`;

let S = null, YO = null;
let RUBROS = [], CATS = [], PLANES = [], COMS = [];
const nombreLocal = id => COMS.find(c => c.id === id)?.nombre || (id ? '#' + id : '—');
const nombrePlan = id => PLANES.find(p => p.id === id)?.nombre || '—';
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;

// CUIT: mismo control que la base (dígito verificador)
function cuitValido(c) {
  const d = String(c || '').replace(/\D/g, '');
  if (d.length !== 11 || !['20','23','24','27','30','33','34'].includes(d.slice(0, 2))) return false;
  const w = [5,4,3,2,7,6,5,4,3,2]; let s = 0;
  for (let i = 0; i < 10; i++) s += +d[i] * w[i];
  let r = 11 - s % 11; if (r === 11) r = 0;
  return r < 10 && r === +d[10];
}
const formatoCuit = c => { const d = String(c || '').replace(/\D/g, ''); return d.length === 11 ? `${d.slice(0,2)}-${d.slice(2,10)}-${d[10]}` : c; };
const diasA = f => f ? Math.round((new Date(f + 'T12:00') - new Date(new Date().toDateString() + ' 12:00')) / 864e5) : null;
function pillAbono(f) {
  const d = diasA(f);
  if (d === null) return '<span class="pill n">Sin abono</span>';
  if (d < 0) return `<span class="pill r">Vencido hace ${-d} d</span>`;
  if (d <= 7) return `<span class="pill y">Vence en ${d} d</span>`;
  return `<span class="pill g">Hasta ${fecha(f)}</span>`;
}
// Botón que pide un segundo toque para confirmar (sin ventanas emergentes)
function confirmar(btn, accion) {
  if (btn.dataset.seguro) return accion();
  const t = btn.textContent; btn.dataset.seguro = '1'; btn.textContent = 'Tocá de nuevo para confirmar';
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.seguro; btn.textContent = t; } }, 4000);
}

// ---------- Estructura ----------
let PEND = {opiniones: 0, reportes: 0, comentarios: 0};
function marco(sec, html) {
  const n = PEND.opiniones + PEND.reportes;
  $app.innerHTML = `<div class="top"><span class="lf">LF</span><b>Moderación</b><a href="./">Ir a la app ›</a></div>`
    + (MODO_PRUEBA ? '<div class="demo">Proyecto de prueba · locales de ejemplo</div>' : '')
    + `<div class="lay"><nav class="side">
        <a href="#/" class="${sec === 'inicio' ? 'on' : ''}"><i>🏠</i>Inicio</a>
        <a href="#/locales" class="${sec === 'locales' ? 'on' : ''}"><i>🏪</i>Locales</a>
        <a href="#/opiniones" class="${sec === 'opiniones' ? 'on' : ''}"><i>💬</i>Opiniones${n ? `<em>${n}</em>` : ''}</a>
        <a href="#/abonos" class="${sec === 'abonos' ? 'on' : ''}"><i>💳</i>Abonos</a>
        <a href="#/metricas" class="${sec === 'metricas' ? 'on' : ''}"><i>📈</i>Métricas</a>
        <a href="#/auditoria" class="${sec === 'auditoria' ? 'on' : ''}"><i>📋</i>Auditoría</a>
        <a href="#/piloto" class="${sec === 'piloto' ? 'on' : ''}"><i>🧪</i>Piloto${PEND.comentarios ? `<em>${PEND.comentarios}</em>` : ''}</a>
        <a href="#/ajustes" class="${sec === 'ajustes' ? 'on' : ''}"><i>⚙️</i>Ajustes</a>
        <a href="#/sistema" class="${sec === 'sistema' ? 'on' : ''}"><i>🛠️</i>Sistema</a>
      </nav><main>${html}</main></div>`;
}
const cargando = sec => marco(sec, '<div class="loading">Cargando…</div>');

async function datosBase() {
  const [r, c, p, k] = await Promise.all([
    sb.from('rubros').select('id,nombre,modulo').order('orden'),
    sb.from('categorias_comercio').select('id,rubro_id,nombre').order('nombre'),
    sb.from('planes').select('*').order('orden'),
    sb.from('comercios').select('id,nombre,slug,altura,mano,estado,verificado,plan_id,abono_vence,rubro_id,creado').order('nombre')]);
  RUBROS = r.data || []; CATS = c.data || []; PLANES = p.data || []; COMS = k.data || [];
}
async function contarPendientes() {
  const [o, r, k] = await Promise.all([
    sb.from('opiniones').select('id', {count: 'exact', head: true}).eq('estado', 'pendiente'),
    sb.from('reportes').select('id', {count: 'exact', head: true}).eq('estado', 'abierto'),
    sb.from('comentarios_piloto').select('id', {count: 'exact', head: true}).eq('resuelto', false)]);
  PEND = {opiniones: o.count || 0, reportes: r.count || 0, comentarios: k.count || 0};
}

// ---------- Entrar ----------
async function iniciar() {
  const session = await sesionValida(); S = session;
  const caja = (t, p) => { $app.innerHTML = `<div class="top"><span class="lf">LF</span><b>Moderación</b></div><main style="max-width:520px;margin:0 auto"><h1>${t}</h1>${p}</main>`; };
  if (!S) {
    caja('Panel del moderador', `<p class="sub">Entrá primero con tu celular en la app.</p><a class="btn main" style="margin-top:16px" href="./#/perfil">Entrar con mi celular</a>
      ${MODO_PRUEBA ? '<div class="card pad" style="margin-top:16px;font-size:14px;line-height:1.5"><b>Modo prueba:</b> el moderador entra con 11 0000 0004 y el código 444444.</div>' : ''}`);
    return false;
  }
  const {data} = await sb.from('perfiles').select('id,nombre,telefono,es_moderador').eq('id', S.user.id).maybeSingle();
  YO = data;
  if (!YO?.es_moderador) {
    caja('Solo para moderación', '<p class="sub">Este panel es para quien administra el portal. Tu cuenta no tiene ese permiso.</p><a class="btn line" style="margin-top:16px" href="./">Volver a la app</a>');
    return false;
  }
  await Promise.all([datosBase(), contarPendientes()]);
  return true;
}

// ---------- Inicio ----------
async function pInicio() {
  cargando('inicio');
  const [al, bq] = await Promise.all([
    sb.from('alertas_resenas').select('*'),
    sb.from('busquedas_sin_resultado').select('*').limit(8)]);
  const n = e => COMS.filter(c => c.estado === e).length;
  const sinVerificar = COMS.filter(c => c.estado === 'pendiente');
  const vencidos = COMS.filter(c => c.estado === 'activo' && diasA(c.abono_vence) !== null && diasA(c.abono_vence) < 0);
  const porVencer = COMS.filter(c => c.estado === 'activo' && diasA(c.abono_vence) !== null && diasA(c.abono_vence) >= 0 && diasA(c.abono_vence) <= 7);
  const tile = (num, txt, href, alerta) => `<a class="card tile ${alerta && num ? 'alerta' : ''}" href="${href}"><b>${num}</b><span>${txt}</span></a>`;
  marco('inicio', `<h1>Hola${YO.nombre ? ', ' + esc(YO.nombre.split(' ')[0]) : ''}</h1><p class="sub">Cómo anda la calle hoy.</p>
    <div class="tiles">
      ${tile(n('activo'), 'locales activos', '#/locales/activo')}
      ${tile(sinVerificar.length, 'esperando alta', '#/locales/pendiente', true)}
      ${tile(n('suspendido'), 'pausados', '#/locales/suspendido')}
      ${tile(PEND.opiniones, 'opiniones por revisar', '#/opiniones', true)}
      ${tile(PEND.reportes, 'reportes abiertos', '#/opiniones/reportes', true)}
      ${tile(vencidos.length, 'abonos vencidos', '#/abonos', true)}
    </div>
    <div class="cols" style="margin-top:6px">
      <div><h2>Para hacer</h2><div class="card pad">
        ${sinVerificar.map(c => `<div class="item"><div class="t"><b>${esc(c.nombre)}</b><small>Alta sin terminar · ${c.verificado ? 'verificado, falta activar' : 'falta verificar'}</small></div><a class="btn line sm" href="#/local/${c.id}">Seguir</a></div>`).join('')}
        ${vencidos.map(c => `<div class="item"><div class="t"><b>${esc(c.nombre)}</b><small>Abono vencido hace ${-diasA(c.abono_vence)} días y sigue activo</small></div><a class="btn line sm" href="#/local/${c.id}">Ver</a></div>`).join('')}
        ${porVencer.map(c => `<div class="item"><div class="t"><b>${esc(c.nombre)}</b><small>El abono vence el ${fecha(c.abono_vence)}</small></div><a class="btn line sm" href="#/local/${c.id}">Ver</a></div>`).join('')}
        ${(al.data || []).map(a => `<div class="item"><div class="t"><b>⚠ ${esc(nombreLocal(a.comercio_id))}</b><small>${a.malas_de_cuentas_nuevas} opiniones malas de cuentas nuevas en 24 h. Puede ser un ataque.</small></div><a class="btn line sm" href="#/opiniones">Revisar</a></div>`).join('')}
        ${!sinVerificar.length && !porVencer.length && !vencidos.length && !(al.data || []).length ? '<div class="empty">Nada pendiente. 👌</div>' : ''}
      </div></div>
      <div><h2>Lo que buscan y no encuentran</h2><div class="card pad">
        ${(bq.data || []).map(b => `<div class="item"><div class="t"><b>“${esc(b.busqueda)}”</b></div><span class="pill n">${b.veces} ${b.veces == 1 ? 'vez' : 'veces'}</span></div>`).join('') || '<div class="empty">Todavía no hay búsquedas sin resultado.</div>'}
        <p class="sub" style="margin-top:10px;font-size:13px">Últimos 30 días. Sirve para saber a qué rubro ir a ofrecerle el portal.</p>
      </div></div>
    </div>`);
}

// ---------- Locales ----------
async function pLocales(filtro = 'todos') {
  await datosBase();
  let q = '';
  const dibujar = () => {
    const lista = COMS.filter(c => (filtro === 'todos' || c.estado === filtro) && (!q || c.nombre.toLowerCase().includes(q)));
    document.getElementById('tabla').innerHTML = lista.length ? `<table><thead><tr><th>Local</th><th>Rubro</th><th>Altura</th><th>Estado</th><th>Plan</th><th>Abono</th></tr></thead><tbody>
      ${lista.map(c => `<tr class="click" data-id="${c.id}"><td><b>${esc(c.nombre)}</b><br><small class="sub">/${esc(c.slug)}</small></td>
        <td>${esc(RUBROS.find(r => r.id === c.rubro_id)?.nombre || '')}</td><td>${c.altura} <small class="sub">${c.mano}</small></td>
        <td>${pillEstado(c.estado)} ${c.verificado ? '' : '<span class="pill n">Sin verificar</span>'}</td>
        <td>${esc(cap(nombrePlan(c.plan_id)))}</td><td>${pillAbono(c.abono_vence)}</td></tr>`).join('')}</tbody></table>`
      : '<div class="empty">No hay locales con ese filtro.</div>';
    document.querySelectorAll('tr[data-id]').forEach(tr => tr.onclick = () => location.hash = '#/local/' + tr.dataset.id);
  };
  marco('locales', `<div class="row" style="justify-content:space-between"><div><h1>Locales</h1><p class="sub">${COMS.length} en total, de Av. Mitre a las vías.</p></div>
      <a class="btn main" href="#/nuevo">+ Dar de alta un local</a></div>
    <div class="row" style="margin:16px 0 12px"><div class="seg">${[['todos','Todos'],['activo','Activos'],['pendiente','Pendientes'],['suspendido','Pausados']].map(([k, t]) =>
      `<button data-f="${k}" class="${filtro === k ? 'on' : ''}">${t}</button>`).join('')}</div>
      <input class="buscar" id="q" placeholder="Buscar por nombre"></div>
    <div class="card tw" id="tabla"></div>`);
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filtro = b.dataset.f; document.querySelectorAll('[data-f]').forEach(x => x.classList.toggle('on', x === b)); dibujar(); });
  document.getElementById('q').oninput = e => { q = e.target.value.trim().toLowerCase(); dibujar(); };

}

const opcionesRubro = sel => RUBROS.map(r => `<option value="${r.id}" ${r.id === sel ? 'selected' : ''}>${esc(r.nombre)}</option>`).join('');
const opcionesCat = (rubro, sel) => '<option value="">(sin categoría)</option>' + CATS.filter(c => c.rubro_id === rubro).map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('');
const opcionesPlan = sel => PLANES.map(p => `<option value="${p.id}" ${p.id === sel ? 'selected' : ''}>${esc(cap(p.nombre))}${+p.precio_mensual ? ' · ' + pesos(p.precio_mensual) + '/mes' : ''}</option>`).join('');
function engancharCuit(input, hint) {
  const ver = () => { const v = input.value.trim(); hint.className = 'hint ' + (!v ? '' : cuitValido(v) ? 'b' : 'm');
    hint.textContent = !v ? '' : cuitValido(v) ? '✓ CUIT válido' : 'El CUIT no es válido: revisá los números.'; };
  input.oninput = ver; input.onblur = () => { if (cuitValido(input.value)) input.value = formatoCuit(input.value); ver(); }; ver();
}
function engancharRubro(rubro, cat) { rubro.onchange = () => cat.innerHTML = opcionesCat(+rubro.value); }

          ${invs.map(i => `<div class="item"><div class="t"><b>${tel(i.telefono)}</b><small>Invitado como ${i.rol === 'duenio' ? 'dueño' : 'empleado'} · todavía no entró</small></div><button class="btn line sm" data-borrar-inv="${i.id}">Quitar</button></div>`).join('')}

          <button class="btn line">Guardar datos</button><div id="d-msg"></div></form></section>

          <div class="row" style="margin-top:10px"><button class="btn line" id="h-guardar">Guardar horarios</button><button class="btn line sm" id="h-copiar">Copiar el lunes a toda la semana</button></div>

  $('h-guardar').onclick = async () => {
    const filas = [];
    for (const r of document.querySelectorAll('.hor[data-dia]')) {
      const v = [...r.querySelectorAll('input')].map(i => i.value);
      for (const k of [0, 2]) {
        if (!v[k] && !v[k + 1]) continue;
        if (!v[k] || !v[k + 1] || v[k] >= v[k + 1]) return msg('h-msg', false, `Revisá el ${DIAS[r.dataset.dia].toLowerCase()}: cada turno necesita hora de apertura y de cierre, y cerrar después de abrir.`);
        filas.push({comercio_id: id, dia_semana: +r.dataset.dia, abre: v[k], cierra: v[k + 1]});
      }
    }
    const d = await sb.from('horarios').delete().eq('comercio_id', id);
    if (d.error) return msg('h-msg', false, errorTexto(d.error));
    if (filas.length) { const {error} = await sb.from('horarios').insert(filas); if (error) return msg('h-msg', false, errorTexto(error)); }
    msg('h-msg', true, 'Horarios guardados.');
  };
}

// ---------- Opiniones y reportes ----------
const MOTIVOS = {falsa: 'Es falsa', ofensiva: 'Ofensiva', datos_personales: 'Tiene datos personales', no_corresponde: 'No corresponde', spam: 'Spam', otro: 'Otro'};
const OBJETOS = {opinion: 'Opinión', historia: 'Historia', media: 'Foto o video', producto: 'Producto', comercio: 'Local', perfil: 'Cuenta'};
const origen = o => o.compra_caja_id ? 'compró con QR' : o.apartado_id ? 'retiró un apartado' : o.turno_id ? 'tuvo un turno' : 'hizo un pedido';
const estrellas = n => `<span class="est">${'★'.repeat(n)}${'☆'.repeat(5 - n)}</span>`;

async function pOpiniones(vista = 'pendientes') {
  cargando('opiniones');
  await contarPendientes();
  const [op, rep, al] = await Promise.all([
    sb.from('opiniones').select('*').eq('estado', 'pendiente').order('creado'),
    sb.from('reportes').select('*').eq('estado', 'abierto').order('creado'),
    sb.from('alertas_resenas').select('*')]);
  const reportes = rep.data || [];
  const idsOp = reportes.filter(r => r.objeto === 'opinion').map(r => +r.objeto_id).filter(Boolean);
  const reportadas = idsOp.length ? (await sb.from('opiniones').select('*').in('id', idsOp)).data || [] : [];
  const alerta = new Set((al.data || []).map(a => a.comercio_id));

  const tarjetaOp = o => `<div class="op" data-op="${o.id}"><div class="row" style="justify-content:space-between"><div><b>${esc(nombreLocal(o.comercio_id))}</b> ${estrellas(o.estrellas)}
      ${alerta.has(o.comercio_id) ? ' <span class="pill r">⚠ ráfaga de malas</span>' : ''}</div><small class="sub">${fechaHora(o.creado)}</small></div>
    <p>${o.texto ? esc(o.texto) : '<i class="sub">(sin texto, solo estrellas)</i>'}</p>
    <div class="row" style="justify-content:space-between"><small class="sub">${esc(o.autor_nombre || 'Vecino')} · ${origen(o)}</small>
      <div class="row"><select class="btn line sm" data-motivo><option value="">Rechazar por…</option><option>Ofensiva o con insultos</option><option>Tiene datos personales</option><option>No habla del local</option><option>Spam o publicidad</option></select>
        <button class="btn ok sm" data-publicar>Publicar</button></div></div><div data-msg></div></div>`;

  marco('opiniones', `<h1>Opiniones</h1><p class="sub">Publicás o rechazás. Nunca se reescribe lo que dijo el vecino.</p>
    <div class="seg" style="margin:16px 0 12px"><button data-v="pendientes" class="${vista === 'pendientes' ? 'on' : ''}">Por revisar (${(op.data || []).length})</button><button data-v="reportes" class="${vista === 'reportes' ? 'on' : ''}">Reportes (${reportes.length})</button></div>
    ${vista === 'pendientes'
      ? `<div class="card">${(op.data || []).map(tarjetaOp).join('') || '<div class="empty">No hay opiniones esperando. 👌</div>'}</div>`
      : `<div class="card">${reportes.map(r => { const o = r.objeto === 'opinion' ? reportadas.find(x => x.id === +r.objeto_id) : null; return `<div class="op" data-rep="${r.id}">
          <div class="row" style="justify-content:space-between"><div><span class="pill r">${esc(MOTIVOS[r.motivo] || r.motivo)}</span> <b>${esc(OBJETOS[r.objeto] || r.objeto)}</b> en ${esc(nombreLocal(r.comercio_id || o?.comercio_id))}</div><small class="sub">${fechaHora(r.creado)}</small></div>
          ${r.detalle ? `<p class="sub">Quien reporta dice: “${esc(r.detalle)}”</p>` : ''}
          ${o ? `<div class="card pad" style="background:#FBFAF7;margin:8px 0">${estrellas(o.estrellas)} <small class="sub">${esc(o.autor_nombre || '')} · ${o.estado}</small><p style="margin:6px 0 0">${esc(o.texto || '(sin texto)')}</p>${o.respuesta_local ? `<p class="sub" style="margin:6px 0 0">Respuesta del local: ${esc(o.respuesta_local)}</p>` : ''}</div>` : `<p class="sub">Objeto #${esc(r.objeto_id)}</p>`}
          <div class="row" style="justify-content:flex-end"><button class="btn line sm" data-res="rechazado">No corresponde, dejar como está</button>
            <button class="btn bad sm" data-res="aceptado">${r.objeto === 'opinion' ? 'Aceptar y ocultar la opinión' : 'Aceptar'}</button></div><div data-msg></div></div>`; }).join('') || '<div class="empty">No hay reportes abiertos. 👌</div>'}</div>`}`);

  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => location.hash = b.dataset.v === 'reportes' ? '#/opiniones/reportes' : '#/opiniones');
  document.querySelectorAll('[data-op]').forEach(box => {
    const id = +box.dataset.op, out = t => box.querySelector('[data-msg]').innerHTML = `<div class="err">${esc(t)}</div>`;
    const cambiar = async (estado, motivo_rechazo) => {
      const {error} = await sb.from('opiniones').update({estado, motivo_rechazo}).eq('id', id);
      if (error) return out(errorTexto(error));
      box.remove(); PEND.opiniones--; if (!document.querySelector('[data-op]')) pOpiniones('pendientes');
    };
    box.querySelector('[data-publicar]').onclick = () => cambiar('publicada', null);
    box.querySelector('[data-motivo]').onchange = e => e.target.value && cambiar('rechazada', e.target.value);
  });
  document.querySelectorAll('[data-rep]').forEach(box => box.querySelectorAll('[data-res]').forEach(b => b.onclick = () => confirmar(b, async () => {
    const {error} = await sb.from('reportes').update({estado: b.dataset.res, resolucion: b.dataset.res === 'aceptado' ? 'Aceptado por moderación' : 'Rechazado por moderación'}).eq('id', +box.dataset.rep);
    if (error) return box.querySelector('[data-msg]').innerHTML = `<div class="err">${esc(errorTexto(error))}</div>`;
    pOpiniones('reportes');
  })));
}

// ---------- Métricas de la calle ----------
function mesAnterior() { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; }
let MET = {dias: '30', orden: 'visitas'};
async function pMetricas() {
  cargando('metricas');
  const d2 = new Date(Date.now() + 60000), d1 = new Date(Date.now() - (+MET.dias) * 864e5);
  const {data, error} = await sb.rpc('metricas_calle', {desde: d1.toISOString(), hasta: d2.toISOString()});
  if (error) { marco('metricas', `<div class="err">${esc(errorTexto(error))}</div>`); return; }
  const filas = (data || []).filter(f => f.estado !== 'pendiente');
  const tot = k => filas.reduce((s, f) => s + Number(f[k] || 0), 0);
  const quietos = filas.filter(f => f.estado === 'activo' && !+f.visitas && !+f.consultas && !+f.compras);
  const COLS = [['visitas', 'Visitas'], ['como_llegar', 'Cómo llegar'], ['consultas', 'WhatsApp'], ['apartados', 'Apartados'], ['compras', 'Compras QR'], ['monto', 'Vendido QR'], ['seguidores', 'Seguidores']];
  const ord = [...filas].sort((a, b) => Number(b[MET.orden]) - Number(a[MET.orden]));
  const n = v => Number(v || 0).toLocaleString('es-AR', {maximumFractionDigits: 0});
  marco('metricas', `<div class="row" style="justify-content:space-between"><div><h1>Métricas de la calle</h1><p class="sub">Lo que el portal le trae a cada local. Sirve para renovar abonos con números.</p></div>
      <div class="seg">${[['7', '7 días'], ['30', '30 días'], ['90', '90 días']].map(([k, t]) => `<button data-d="${k}" class="${MET.dias === k ? 'on' : ''}">${t}</button>`).join('')}</div></div>
    <div class="tiles">
      <div class="card tile"><b>${n(tot('visitas'))}</b><span>visitas a páginas</span></div>
      <div class="card tile"><b>${n(tot('como_llegar'))}</b><span>pidieron cómo llegar</span></div>
      <div class="card tile"><b>${n(tot('consultas'))}</b><span>consultas por WhatsApp</span></div>
      <div class="card tile"><b>${n(tot('apartados'))}</b><span>apartados</span></div>
      <div class="card tile"><b>${n(tot('compras'))}</b><span>compras con QR</span></div>
      <div class="card tile"><b>${pesos(tot('monto'))}</b><span>vendido con QR</span></div>
    </div>
    ${quietos.length ? `<div class="err" style="margin-top:14px">Sin movimiento en ${MET.dias} días: ${quietos.map(f => esc(f.nombre)).join(', ')}. Conviene visitarlos antes de que venza el abono.</div>` : ''}
    <div class="card tw" style="margin-top:14px"><table><thead><tr><th>Local</th>${COLS.map(([k, t]) => `<th data-o="${k}" style="cursor:pointer;text-align:right;${MET.orden === k ? 'color:var(--ink)' : ''}">${t}${MET.orden === k ? ' ▼' : ''}</th>`).join('')}<th></th></tr></thead><tbody>
      ${ord.map(f => `<tr><td><b>${esc(f.nombre)}</b><br>${pillEstado(f.estado)} <small class="sub">${esc(cap(f.plan))}</small></td>
        ${COLS.map(([k]) => `<td style="text-align:right">${k === 'monto' ? pesos(f[k]) : n(f[k])}</td>`).join('')}
        <td style="text-align:right;white-space:nowrap"><a class="btn line sm" href="resultados.html?c=${f.comercio_id}&p=${MET.dias}">Ver ›</a></td></tr>`).join('') || '<tr><td colspan="9"><div class="empty">Todavía no hay locales activos.</div></td></tr>'}
    </tbody></table></div>
    <p class="sub" style="font-size:13px;margin-top:10px">Tocá el título de una columna para ordenar. En cada local, “Ver” abre sus resultados para imprimir o mandárselos por WhatsApp.</p>`);
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { MET.dias = b.dataset.d; pMetricas(); });
  document.querySelectorAll('[data-o]').forEach(t => t.onclick = () => { MET.orden = t.dataset.o; pMetricas(); });
}

  const quien = id => ps.find(p => p.id === id)?.nombre || (id ? 'Cuenta sin nombre' : 'Sin cuenta');
  const cuenta = t => lista.filter(c => c.tipo === t).length;
  const activos = COMS.filter(c => c.estado === 'activo');

    <div class="row" style="margin:16px 0 12px"><div class="seg"><button data-pil="abiertos" class="${PIL === 'abiertos' ? 'on' : ''}">Sin resolver</button><button data-pil="todos" class="${PIL === 'todos' ? 'on' : ''}">Todos</button></div></div>

        <div><span class="pill ${TIPOS_C[c.tipo][2]}">${TIPOS_C[c.tipo][0]} ${TIPOS_C[c.tipo][1]}</span> <b>${esc(quien(c.perfil_id))}</b>
          <small class="sub">· ${c.desde === 'panel' ? 'desde el panel de ' + esc(nombreLocal(c.comercio_id)) : 'desde la app' + (c.pantalla ? ' (' + esc(c.pantalla) + ')' : '')}</small></div>
        <small class="sub">${fechaHora(c.creado)}</small></div>
      <p>${esc(c.texto)}</p>

        : `<div class="row"><input class="buscar" data-nota placeholder="Nota (opcional): qué se hizo" style="max-width:none"><button class="btn ok sm" data-resolver>Marcar resuelto</button></div>`}</div>`).join('')
      || '<div class="empty">No hay comentarios por ahora.</div>'}</div>
    <h2>Carteles para los locales del piloto</h2>
    <div class="card pad"><p class="sub">Un cartel con QR para la vidriera, uno para la puerta y uno chico para la caja. Se imprimen en A4.</p>
      <div class="row" style="margin-top:10px">${activos.map(c => `<a class="btn line sm" href="carteles.html?c=${c.id}" target="_blank">🖨️ ${esc(c.nombre)}</a>`).join('') || '<span class="sub">No hay locales activos.</span>'}</div></div>
    <h2>Lista para el piloto</h2>
    <div class="card pad" style="line-height:1.7;font-size:14.5px">
      1. Elegir 5 a 10 locales de rubros distintos (ropa, gastronomía, uno con turnos, una óptica).<br>
      2. Darlos de alta en <a href="#/locales">Locales</a> y armar con cada dueño su vidriera y sus productos.<br>
      3. Pegar los carteles en la vidriera y en la caja.<br>
      4. Un mes de prueba: leer esta pantalla cada semana y mirar <a href="#/metricas">Métricas</a>.<br>
      5. Con los números del piloto, decidir precios y reglas en <a href="#/ajustes">Ajustes</a>.</div>`);

// ---------- Ajustes: lo que todavía no está decidido se cambia acá ----------
async function pAjustes(msg = '') {
  cargando('ajustes');
  const [aj, bl] = await Promise.all([
    sb.from('ajustes').select('*').order('clave'),
    sb.from('bloque_tipos').select('codigo,nombre,grupo,plan_minimo').order('grupo')]);
  await datosBase();
  const ultimo = (aj.data || []).reduce((m, a) => a.actualizado > m ? a.actualizado : m, '');
  marco('ajustes', `<h1>Ajustes</h1><p class="sub">Reglas que todavía no están decididas. Se pueden cambiar cuando quieras: la app las toma en el momento, sin tocar el código.</p>${msg}
    <h2>Puntos y apartados</h2>
    <div class="cols">${(aj.data || []).map(a => `<div class="card pad"><div class="field" style="margin:0"><label for="aj-${a.clave}">${esc(a.nombre)}</label>
        <input id="aj-${a.clave}" data-aj="${a.clave}" type="number" step="any" min="${a.minimo}" max="${a.maximo}" value="${+a.valor}">
        <small>${esc(a.ayuda || '')} Entre ${(+a.minimo).toLocaleString('es-AR')} y ${(+a.maximo).toLocaleString('es-AR')}.</small></div></div>`).join('')}</div>
    <p class="sub" style="font-size:13px;margin-top:8px">${ultimo ? 'Último cambio: ' + fechaHora(ultimo) + '. ' : ''}Cada cambio queda en la auditoría. Los puntos ya sumados no cambian.</p>
    <button class="btn main" id="aj-guardar" style="margin-top:10px">Guardar puntos y apartados</button>
    <h2>Planes</h2>
    <div class="card tw"><table><thead><tr><th>Plan</th><th>Precio por mes</th><th>Locales</th></tr></thead><tbody>
      ${PLANES.map(p => `<tr><td><b>${esc(cap(p.nombre))}</b></td><td><input class="buscar" style="min-width:0;max-width:160px" type="number" min="0" step="500" data-plan="${p.id}" value="${+p.precio_mensual}"></td>
        <td>${COMS.filter(c => c.plan_id === p.id).length}</td></tr>`).join('')}</tbody></table></div>
    <p class="sub" style="font-size:13px;margin-top:8px">De prueba: con precio 0 no se cobra nada. Los precios solo se muestran al dar de alta y en las condiciones.</p>
    <h2>Qué trae cada plan</h2>
    <div class="card tw"><table><thead><tr><th>Bloque de la vidriera</th><th>Grupo</th><th>Desde el plan</th></tr></thead><tbody>
      ${(bl.data || []).map(b => `<tr><td>${esc(b.nombre)}</td><td><small class="sub">${esc(b.grupo)}</small></td>
        <td><select class="buscar" style="min-width:0;max-width:170px" data-bloque="${esc(b.codigo)}">${PLANES.map(p => `<option value="${p.id}" ${p.id === b.plan_minimo ? 'selected' : ''}>${esc(cap(p.nombre))}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>
    <button class="btn main" id="pl-guardar" style="margin-top:12px">Guardar planes</button>`);
  document.getElementById('aj-guardar').onclick = async () => {
    for (const i of document.querySelectorAll('[data-aj]')) {
      const a = (aj.data || []).find(x => x.clave === i.dataset.aj); if (+i.value === +a.valor) continue;
      const {error} = await sb.from('ajustes').update({valor: +i.value}).eq('clave', a.clave);
      if (error) return pAjustes(`<div class="err">${esc(a.nombre)}: ${/check/.test(error.message) ? 'ese valor está fuera del rango permitido.' : esc(errorTexto(error))}</div>`);
    }
    pAjustes('<div class="okmsg">✓ Guardado. La app ya usa los valores nuevos.</div>');
  };
  document.getElementById('pl-guardar').onclick = async () => {
    for (const i of document.querySelectorAll('[data-plan]')) {
      const p = PLANES.find(x => x.id === +i.dataset.plan); if (+i.value === +p.precio_mensual) continue;
      const {error} = await sb.from('planes').update({precio_mensual: +i.value || 0}).eq('id', p.id);
      if (error) return pAjustes(`<div class="err">${esc(errorTexto(error))}</div>`);
    }
    for (const s of document.querySelectorAll('[data-bloque]')) {
      const b = (bl.data || []).find(x => x.codigo === s.dataset.bloque); if (+s.value === b.plan_minimo) continue;
      const {error} = await sb.from('bloque_tipos').update({plan_minimo: +s.value}).eq('codigo', b.codigo);
      if (error) return pAjustes(`<div class="err">${esc(errorTexto(error))}</div>`);
    }
    pAjustes('<div class="okmsg">✓ Planes guardados.</div>');
  };
}

      ${uso(e.archivos_mb, e.limites.archivos_mb, 'Fotos, videos y documentos', 'MB')}
      ${uso(e.activos_mes, e.limites.usuarios_mes, 'Vecinos activos este mes', 'personas')}
      <div class="card pad"><b>Último respaldo</b>
        ${r ? `<p style="margin-top:8px">${r.ok ? '✅' : '❌'} ${fechaHora(r.creado)} · ${n(r.bytes / 1048576)} MB · ${r.tablas || '?'} tablas</p>
          <p class="sub" style="margin-top:4px">${horas > 36 ? '⚠ Hace más de un día y medio que no hay respaldo: revisá GitHub Actions.' : `${e.respaldos_30d} respaldos en los últimos 30 días.`}</p>`
        : '<p class="hint m" style="margin-top:8px">Todavía no hay respaldos. Seguí los pasos de “Respaldos” en el LEEME para activarlos (es gratis).</p>'}</div>
    </div>
    <h2>Movimiento</h2>
    <div class="tiles">
      <div class="card tile"><b>${n(e.locales)}</b><span>locales activos</span></div>
      <div class="card tile"><b>${n(e.cuentas)}</b><span>cuentas · ${n(e.cuentas_semana)} esta semana</span></div>
      <div class="card tile"><b>${n(e.avisos_semana)}</b><span>avisos enviados en 7 días</span></div>
      ${e.codigos_24h !== null ? `<div class="card tile"><b>${n(e.codigos_24h)}</b><span>códigos de acceso en 24 h (de prueba, sin SMS)</span></div>` : ''}
    </div>
    <h2>Tareas automáticas</h2>
    <div class="card tw">${(e.tareas || []).length ? `<table><thead><tr><th>Tarea</th><th>Cuándo (UTC)</th><th>Última vez</th><th>Fallas en 7 días</th></tr></thead><tbody>
      ${e.tareas.map(t => `<tr><td><code>${esc(t.nombre)}</code></td><td><code>${esc(t.cuando)}</code></td>
        <td>${t.fecha ? `${t.ultimo === 'succeeded' ? '✅' : t.ultimo === 'failed' ? '❌' : '⏳'} ${fechaHora(t.fecha)}` : '<span class="sub">todavía no corrió</span>'}</td>
        <td>${+t.fallas ? `<span class="pill r">${t.fallas}</span>` : '<span class="pill g">0</span>'}</td></tr>`).join('')}</tbody></table>`
      : '<div class="empty">No se pudo leer el estado de las tareas.</div>'}</div>
    <p class="sub" style="font-size:13px;margin-top:12px">Ojo: en el plan gratis, Supabase pausa el proyecto si pasa una semana sin uso. El respaldo diario de GitHub lo mantiene despierto.</p>`);
}

// ---------- Auditoría ----------
const TABLAS = {comercios: 'Datos del local', comercio_usuarios: 'Equipo', horarios: 'Horarios', comercio_estilo: 'Estilo de la vidriera',
  comercio_intro: 'Intro', comercio_bloques: 'Bloques', vidriera_versiones: 'Versión de la vidriera', productos: 'Producto', variantes: 'Stock',
  promos: 'Promo', compras_caja: 'Compra en caja', movimientos_puntos: 'Puntos', apartados: 'Apartado', opiniones: 'Opinión',
  sanciones: 'Sanción', avisos_seguidores: 'Aviso a seguidores', pagos_abono: 'Pago del abono'};
const corto = v => v === null || v === undefined ? '—' : typeof v === 'object' ? JSON.stringify(v).slice(0, 40) : String(v).slice(0, 40);
// Cambios seguidos del mismo tipo en el mismo minuto se muestran juntos (ej.: 12 horarios)
function agrupar(lista) {
  const out = [];
  for (const a of lista) {
    const g = out[out.length - 1];
    if (g && g[0].tabla === a.tabla && g[0].accion === a.accion && g[0].usuario_id === a.usuario_id && Math.abs(new Date(g[0].creado) - new Date(a.creado)) < 60000) g.push(a); else out.push([a]);
  }
  return out;
}
function resumen(a) {
  const d = a.detalle || {};
  if (a.accion === 'editar') {
    const ks = Object.keys(d).filter(k => !['actualizado', 'creado', 'moderado_por', 'publicado_en', 'verificado_por', 'verificado_en', 'respondido_en', 'resuelto_por', 'resuelto_en'].includes(k));
    return ks.slice(0, 3).map(k => `${k}: ${corto(d[k]?.antes)} → ${corto(d[k]?.despues)}`).join(' · ') + (ks.length > 3 ? ` · y ${ks.length - 3} más` : '');
  }
  if (d.dia_semana !== undefined) return `${DIAS[d.dia_semana]} ${String(d.abre).slice(0, 5)} a ${String(d.cierra).slice(0, 5)}`;
  const nombre = d.nombre || d.titulo || d.motivo || d.talle || d.codigo || (d.monto !== undefined ? pesos(d.monto) : '') || d.tipo || d.rol || '';
  return String(nombre).slice(0, 80);
}
async function pAuditoria(local) {
  cargando('auditoria');
  await datosBase();
  let filtro = local ? +local : 0, desde = 0; const PAG = 50;
  marco('auditoria', `<h1>Auditoría</h1><p class="sub">Quién cambió qué y cuándo, en cualquier local. La llena la base sola: nadie la puede editar.</p>
    <div class="row" style="margin:16px 0 12px"><select id="au-l" class="buscar"><option value="0">Todos los locales</option>${COMS.map(c => `<option value="${c.id}" ${c.id === filtro ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('')}</select></div>
    <div class="card tw"><table class="aud"><thead><tr><th>Cuándo</th><th>Quién</th><th>Local</th><th>Qué</th><th>Detalle</th></tr></thead><tbody id="au-b"></tbody></table></div>
    <div style="text-align:center;margin-top:12px"><button class="btn line" id="au-mas" hidden>Ver más</button></div>`);
  const nombres = {};
  const traer = async (limpiar) => {
    if (limpiar) { desde = 0; document.getElementById('au-b').innerHTML = ''; }
    let q = sb.from('auditoria').select('*').order('creado', {ascending: false}).range(desde, desde + PAG - 1);
    if (filtro) q = q.eq('comercio_id', filtro);
    const {data} = await q; const filas = data || [];
    const faltan = [...new Set(filas.map(a => a.usuario_id).filter(u => u && !(u in nombres)))];
    if (faltan.length) { const {data: ps} = await sb.from('perfiles').select('id,nombre,telefono,es_moderador').in('id', faltan); (ps || []).forEach(p => nombres[p.id] = p); }
    const quien = u => { const p = nombres[u]; return !u ? '<small>La base (automático)</small>' : p ? `${esc(p.nombre || 'Sin nombre')}<br><small>${tel(p.telefono)}${p.es_moderador ? ' · moderador' : ''}</small>` : '<small>(cuenta borrada)</small>'; };
    document.getElementById('au-b').insertAdjacentHTML('beforeend', filas.map(a => `<tr><td><small>${fechaHora(a.creado)}</small></td><td>${quien(a.usuario_id)}</td>
      <td>${esc(nombreLocal(a.comercio_id))}</td><td><b>${esc(TABLAS[a.tabla] || a.tabla)}</b><br><small>${a.accion}</small></td><td class="det">${esc(resumen(a))}</td></tr>`).join('')
      || (desde ? '' : '<tr><td colspan="5"><div class="empty">Sin cambios registrados.</div></td></tr>'));
    desde += filas.length;
    document.getElementById('au-mas').hidden = filas.length < PAG;
  };
  document.getElementById('au-l').onchange = e => { filtro = +e.target.value; traer(true); };
  document.getElementById('au-mas').onclick = () => traer(false);
  traer(true);
}

// ---------- Rutas ----------
let listo = false;
async function ruta() {
  if (!listo) { listo = await iniciar(); if (!listo) return; }
  const h = location.hash.replace(/^#\/?/, '').split('/');
  try {
    if (h[0] === 'locales') await pLocales(h[1] || 'todos');
    else if (h[0] === 'nuevo') await pNuevo();
    else if (h[0] === 'local' && +h[1]) await pLocal(+h[1]);
    else if (h[0] === 'opiniones') await pOpiniones(h[1] === 'reportes' ? 'reportes' : 'pendientes');
    else if (h[0] === 'abonos') await pAbonos();
    else if (h[0] === 'metricas') await pMetricas();
    else if (h[0] === 'sistema') await pSistema();
    else if (h[0] === 'piloto') await pPiloto();
    else if (h[0] === 'ajustes') await pAjustes();
    else if (h[0] === 'auditoria') await pAuditoria(h[1]);
    else await pInicio();
  } catch (e) {
    marco('inicio', `<div class="err">Algo falló al cargar: ${esc(errorTexto(e))}</div>`);
  }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', ruta);
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') { listo = false; ruta(); } });
ruta();
</script>
